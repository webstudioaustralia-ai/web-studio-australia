version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: ws-australia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webstudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webstudio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ws-australia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - webstudio-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ws-australia-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/webstudio
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webstudio-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ws-australia-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_WEBSOCKET_URL: ws://localhost:5000/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - webstudio-network

  # Python AI Agent
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: ws-australia-ai-agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: gpt-4
      REDIS_URL: redis://redis:6379/1
      API_URL: http://backend:5000/api
    ports:
      - "8000:8000"
    volumes:
      - ./ai-agent:/app
    depends_on:
      - backend
      - redis
    networks:
      - webstudio-network

  # Live Chat WebSocket Server
  live-chat:
    build:
      context: ./live-chat-system
      dockerfile: Dockerfile
    container_name: ws-australia-live-chat
    environment:
      CHAT_SERVER_PORT: 5001
      REDIS_URL: redis://redis:6379/1
      API_URL: http://backend:5000/api
    ports:
      - "5001:5001"
    volumes:
      - ./live-chat-system:/app
      - /app/node_modules
    depends_on:
      - backend
      - redis
    networks:
      - webstudio-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ws-australia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - live-chat
    networks:
      - webstudio-network

volumes:
  postgres_data:
  redis_data:

networks:
  webstudio-network:
    driver: bridge
